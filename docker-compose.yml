# EduSync – run everything with:  docker compose up --build
# Configuration comes from the .env file next to this file (copy .env.example to .env first).
name: edusync

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edusync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-edusync}
    volumes:
      - edusync_pgdata:/var/lib/postgresql/data      # data survives restarts
    ports:
      - "${DB_HOST_PORT:-5433}:5432"                  # 5433 on your PC, so it never clashes with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy                    # backend starts only after PostgreSQL is ready
    environment:
      PORT: 5000
      DB_HOST: db                                     # service name on the compose network
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-edusync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-edusync}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-8}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      GROUP_MAX_SIZE: ${GROUP_MAX_SIZE:-5}
      ADMIN_NAME: ${ADMIN_NAME:-Prof. Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@edusync.demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      SEED_ON_START: ${SEED_ON_START:-false}
      ALLOW_SEED_RESET: ${ALLOW_SEED_RESET:-false}
    volumes:
      - ./database:/database:ro                       # SQL migrations
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  edusync_pgdata:
